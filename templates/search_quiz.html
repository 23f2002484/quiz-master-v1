
{% include 'admin_sidebar.html'%}
<div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded">
                    <div class="card-body">
                    <h2 class="text-center mb-4 text-primary">Quiz Details</h2>
                    <p><strong>ID : </strong>{{quiz.id}}</p>
                    <p><strong>Chapter : </strong>{{quiz.chapter_id}}</p>
                    <p><strong>Remarks : </strong>{{quiz.remarks}}</p>
                    <p><strong>Quiz Date : </strong>{{quiz.quiz_date}}</p> 
                    <p><strong>Time Duration : </strong>{{quiz.time_dur}}</p>
                    <a href="{{url_for('manage_question',quiz_id=quiz.id)}}"class="btn btn-outline-info btn-sm w-100 mb-2" style="min-width: 130px;">Manage Questions</a>
                    <a href="{{url_for('edit_quiz',quiz_id=quiz.id)}}"class="btn btn-outline-warning btn-sm w-100 mb-2" style="min-width: 130px;">Edit</a>
                    <form action="{{url_for('delete_quiz',quiz_id=quiz.id)}}" method="post" >
                        <button class="btn btn-outline-danger btn-sm w-100" type="submit" style="min-width: 130px;">Delete</button>
                    </form>
                    </div>              
                </div>
            </div>
        </div>
    </div>
</div>
