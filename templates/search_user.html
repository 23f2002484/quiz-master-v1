{% include 'admin_sidebar.html'%}
<div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded">
                    <div class="card-body">
                    <h2 class="text-center mb-4 text-primary">User Details</h2>
                    <p><strong>ID : </strong>{{user.id}}</p>
                    <p><strong>Email : </strong>{{user.email}}</p>
                    <p><strong>Username : </strong>{{user.username}}</p>
                    <p><strong>Qualification : </strong>{{user.qualification}}</p> 
                    <p><strong>D.O.B : </strong>{{user.date_of_birth}}</p> 
                    {% if user.id!=1 %}
                        <a href="{{url_for('quiz_history',user_id=user.id)}}"class="btn btn-outline-info btn-sm w-100 mb-2" style="min-width: 130px;">Quiz History</a>
                        <form action="{{url_for('delete_user',id=user.id)}}" method="post" >
                            <button class="btn btn-outline-danger btn-sm w-100" type="submit" style="min-width: 130px;">Delete</button>
                        </form>
                    {% endif %}
                    </div>              
                </div>
            </div>
        </div>
    </div>
</div>
