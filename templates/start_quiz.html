{% include 'student_sidebar.html'%}
<br><br>
{%block content%}
<div class="container mt-5">
    <h2 class="text-center text-primary"></h2>
    <div class="card p-4 shadow-lg rounded">
        <form method="POST" action="{{url_for('submit_quiz',quiz_id=quiz.id)}}">
            {%for question in questions%}
            <div class="question mb-4 p-3 border rounded bg-light">
                <p class="fw-bold text-dark">{{loop.index}}. {{question.que}}</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{question.id}}" value="A" id="q{{question.id}}">
                    <label class="form-check-label"for="q{{question.id}}A">{{question.o_a}}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{question.id}}" value="B" id="q{{question.id}}">
                    <label class="form-check-label"for="q{{question.id}}B">{{question.o_b}}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{question.id}}" value="C" id="q{{question.id}}">
                    <label class="form-check-label"for="q{{question.id}}C">{{question.o_c}}</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="{{question.id}}" value="D" id="q{{question.id}}">
                    <label class="form-check-label"for="q{{question.id}}D">{{question.o_d}}</label>
                </div>
            
            </div>
            
            {%endfor%}
            <div class="text-center">
                <button type="submit"class="btn btn-primary">Submit Quiz</button>

            </div>
            
        </form>
    </div>

</div>
{%endblock%}
