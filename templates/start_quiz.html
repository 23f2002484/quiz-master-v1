{% include 'student_sidebar.html'%}
<br><br>
{%block content%}
<div class="container mt-5">
    <h2></h2>
    
        <form method="POST" action="{{url_for('submit_quiz',quiz_id=quiz.id)}}">
            {%for question in questions%}
            <div class="question">
                <p><strong>{{loop.index}}. {{question.que}}</strong></p>
                <label><input type="radio" name="{{question.id}}" value="A">{{question.o_a}}</label>
                <br>
                <label><input type="radio" name="{{question.id}}" value="B">{{question.o_b}}</label>
                <br>
                <label><input type="radio" name="{{question.id}}" value="C">{{question.o_c}}</label>
                <br>
                <label><input type="radio" name="{{question.id}}" value="D">{{question.o_d}}</label>
                <br>
            </div>
            <hr>
            {%endfor%}
            <button type="submit"class="btn btn-success">Submit Quiz</button>

        </form>


        
     
</div>
{%endblock%}
