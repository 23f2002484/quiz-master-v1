{% include 'admin_sidebar.html'%}


<br><br>
<div class="container mt-5">
    <h2>Manage Chapter</h2>
    <table class="table table-hover">
        <thead class="table-info">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {%for chapter in chapters%}
          <tr>
            <td>{{chapter.id}}</td>
            <td>{{chapter.name}}</td>
            <td>{{chapter.description}}</td>
            <td>
            <a href="{{url_for('edit_chapter',chapter_id=chapter.id,subject_id=subject_id)}}"class="btn btn-outline-warning me-2 d-inline-block">Edit</a>
            <form action="{{url_for('delete_chapter',chapter_id=chapter.id,subject_id=subject_id)}}" method="post" class="d-inline-block">
                <button class="btn btn-outline-danger" type="submit">Delete</button>
            </form>
            </td>
          </tr>
          {%endfor%}
        </tbody>
      </table>
</div>
<div class="row justify-content-center">
  <div class="col-md-10">
    <a href="{{url_for('add_chapter',subject_id=subject_id)}}" class="btn btn-outline-primary">Add New Chapter</a>

  </div>
  
</div>
