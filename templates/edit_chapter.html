{% include 'admin_sidebar.html'%}
<br><br><br>
<form method="post" action="{{url_for('edit_chapter',chapter_id=chapter.id,subject_id=subject_id)}}">
    {%with messages =get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category ,m in messages%}
                <div class="alert alert-{{category}} text-center">{{m}}</div>
            {%endfor%}
        {%endif%}
    {%endwith%}
    <h2>Edit Chapter</h2>
    <label for="id"><b>ID : </b></label>
    <input type="text" id="id" name="id" value="{{chapter.id}}" required>
    <br><br>

    <label for="name"><b>Name : </b></label>
    <input type="text" id="name" name="name" value="{{chapter.name}}"required>
    <br><br>


    <label for="description"><b>Description : </b></label>
    <input type="text" id="description" name="description" value="{{chapter.description}}"required>
    <br><br>


   
    <input type="submit" value ="Submit">
</form>
