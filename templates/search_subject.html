
{% include 'admin_sidebar.html'%}
<div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded">
                    <div class="card-body">
                    <h2 class="text-center mb-4 text-primary">Subject Details</h2>
                    <p><strong>ID : </strong>{{subject.id}}</p>
                    <p><strong>Name : </strong> {{subject.name}}</p>
                    <p><strong>Description : </strong>{{subject.description}}</p>
                    <a href="{{url_for('manage_chapter',subject_id=subject.id)}}"class="btn btn-outline-info btn-sm w-100 mb-2" style="min-width: 130px;">Manage Chapter</a>
                    <a href="{{url_for('edit_subject',subject_id=subject.id)}}"class="btn btn-outline-warning btn-sm w-100 mb-2" style="min-width: 130px;">Edit</a>
                    <form action="{{url_for('delete_subject',subject_id=subject.id)}}" method="post" >
                        <button class="btn btn-outline-danger btn-sm w-100" type="submit" style="min-width: 130px;">Delete</button>
                    </form>
                    </div>              
                </div>
            </div>
        </div>
    </div>
</div>
